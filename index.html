<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0b0c">
<title>热量账本</title>
<link rel="stylesheet" href="style.css?v=465">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
</head>
<body>

<div class="statusbg" aria-hidden="true"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">热量<span>账本</span><i class="btag" id="brandTag"></i></div>
    <div class="topactions">
      <button class="topbtn" id="cloudRefresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M20 11a8 8 0 1 0-2.4 6.3"/><path d="M20.5 4.5v6h-6"/>
        </svg>
        数据同步
      </button>
      <button class="topbtn topicon" id="hardReloadTop" aria-label="强制更新" title="强制更新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12a8 8 0 0 1-13.6 5.7"/><path d="M4 12a8 8 0 0 1 13.6-5.7"/>
          <path d="M17.9 3.6v3.4h-3.4"/><path d="M6.1 20.4V17h3.4"/>
        </svg>
      </button>
      <button class="topbtn topicon bellbtn" id="notifyBell" aria-label="提醒记录" title="提醒记录">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 22.2a2.3 2.3 0 0 0 2.3-2.3H9.7a2.3 2.3 0 0 0 2.3 2.3Zm7.1-5.7V11a7.1 7.1 0 0 0-5.3-6.9V3.6a1.8 1.8 0 1 0-3.6 0v.5A7.1 7.1 0 0 0 4.9 11v5.5L3 18.4v1.1h18v-1.1l-1.9-1.9Z"/>
        </svg>
        <i class="dot" id="notifyDot" hidden></i>
      </button>
      <button class="topbtn topicon" id="goMe" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
  </div>

  <div class="scroller" id="scroller">
  <div class="sc-body" id="scBody">
  <!-- ============ 今日 ============ -->
  <section class="view on" id="view-today">
    <div id="setupBanner"></div>
    <div class="daterow">
      <button class="arrow" id="prevDay" aria-label="前一天">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <div class="d">
        <b id="dateLabel">—</b>
        <i id="dateSub"></i>
      </div>
      <button class="arrow" id="nextDay" aria-label="后一天">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="hero" id="hero">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop id="ringS0" offset="0%" stop-color="#d6ff4b"/>
            <stop id="ringS1" offset="45%" stop-color="#57ffc8"/>
            <stop id="ringS2" offset="100%" stop-color="#d6ff4b"/>
          </linearGradient>
          <!-- 玻璃边光：和卡片描边同一种做法 —— 一圈很细的亮边，上亮下暗 -->
          <linearGradient id="rimGrad" x1="0" y1="0" x2="0.75" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="30%" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="65%" stop-color="#ffffff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16"/>
          </linearGradient>
          <linearGradient id="ringTrack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#161d19"/>
            <stop offset="100%" stop-color="#0b0f0d"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="100" cy="100" r="84" fill="none" stroke="#2b3a33" stroke-width="13"/>
        <!-- 先画一圈略宽的亮边，再把主弧压在上面 → 两侧各留出一条 1px 的玻璃边光 -->
        <circle class="rim" id="ringRim" cx="100" cy="100" r="84" fill="none"
                stroke="url(#rimGrad)"
                stroke-width="14.6" stroke-linecap="round"
                stroke-dasharray="527.8" stroke-dashoffset="527.8"/>
        <circle class="prog" id="ring" cx="100" cy="100" r="84" fill="none"
                stroke="url(#ringGrad)"
                stroke-width="13" stroke-linecap="round"
                stroke-dasharray="527.8" stroke-dashoffset="527.8"/>
      </svg>
      <div class="center">
        <div class="lbl" id="heroLbl">热量缺口</div>
        <div class="num" id="heroNum">—</div>
        <div class="unit">千卡</div>
        <div class="sub" id="heroSub"></div>
      </div>
    </div>

    <div class="stats">
      <div>
        <div class="k">摄入</div>
        <div class="v" id="stIntake">—</div>
      </div>
      <div>
        <div class="k">消耗</div>
        <div class="v" id="stExp">—</div>
        <div class="at" id="stExpAt"></div>
      </div>
      <div>
        <div class="k">还可以吃</div>
        <div class="v" id="stLeft">—</div>
      </div>
    </div>

    <div class="macros">
      <div class="macro">
        <div class="row1"><span class="n">蛋白质</span>
          <span class="g"><b id="pNow">0</b> / <span id="pGoal">0</span> g</span></div>
        <div class="bar p"><i id="pBar" style="width:0"></i></div>
      </div>
      <div class="macro">
        <div class="row1"><span class="n">碳水</span>
          <span class="g"><b id="cNow">0</b> / <span id="cGoal">0</span> g</span></div>
        <div class="bar c"><i id="cBar" style="width:0"></i></div>
      </div>
      <div class="macro">
        <div class="row1"><span class="n">脂肪</span>
          <span class="g"><b id="fNow">0</b> / <span id="fGoal">0</span> g</span></div>
        <div class="bar f"><i id="fBar" style="width:0"></i></div>
      </div>
    </div>

    <div class="sec">
      <h2>今天吃了什么</h2>
      <button class="act" id="addTop">＋ 记录</button>
    </div>
    <div class="meals" id="meals"></div>

    <div style="height:20px"></div>
  </section>

  <!-- ============ 趋势 ============ -->
  <section class="view" id="view-trends">
    <div class="seg" id="trendSeg">
      <button data-d="7">7 天</button>
      <button data-d="30" class="on">30 天</button>
      <button data-d="90">90 天</button>
    </div>
    <div id="trendBody"></div>
    <div style="height:20px"></div>
  </section>

  <!-- ============ 我的 ============ -->
  <section class="view" id="view-me">
    <div id="meBody"></div>
    <div style="height:20px"></div>
  </section>

  </div><!-- /sc-body -->
  </div><!-- /scroller -->

  <nav class="tabbar">
    <div class="inner">
      <button class="tab on" data-view="today">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.6" stroke-opacity=".42"/><path d="M12 4.4a7.6 7.6 0 0 1 7.6 7.6"/></svg>
        <span>今日</span>
      </button>
      <button class="fab" id="fab" aria-label="记录">＋</button>
      <button class="tab" data-view="trends">
        <svg viewBox="0 0 24 24"><path d="M5.5 19.2v-4.6M12 19.2v-9.4M18.5 19.2v-13.4"/></svg>
        <span>趋势</span>
      </button>
    </div>
  </nav>
</div>


<!-- ============ 记录弹层 ============ -->
<div class="sheet-mask" id="addMask"></div>
<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <div class="sh-hd">
    <h2 id="addTitle">记录食物</h2>
    <button class="x" id="addClose">×</button>
  </div>
  <div class="sh-body">
    <div class="tabs3" id="addTabs">
      <button data-m="photo" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8.5h2.6L8.2 6h7.6l1.6 2.5H20v10H4z"/><circle cx="12" cy="13" r="3.1"/></svg>拍照</button>
      <button data-m="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.3"/><path d="M15.7 15.7 20 20"/></svg>搜索</button>
      <button data-m="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 20h3.6L19 8.6a2.2 2.2 0 0 0-3.1-3.1L4.5 17z"/><path d="M14.2 7.2l2.6 2.6"/></svg>描述</button>
    </div>

    <!-- 拍照 -->
    <div class="pane" id="pane-photo">
      <!-- 一个框：左右两个照片位 + 一组按钮 -->
      <div class="drop photobox" id="photoDrop">
        <div class="pslot" data-slot="1">
          <div class="pslot-body">
            <span class="pslot-empty" id="emptyA">食物照片</span>
            <img class="preview" id="photoPreview" hidden alt="">
            <button class="shotdel" id="photoDel" hidden aria-label="删除照片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
        </div>
        <div class="pslot" data-slot="2">
          <div class="pslot-body">
            <span class="pslot-empty" id="emptyB">营养成分表</span>
            <img class="preview" id="pv2" hidden alt="">
            <button class="shotdel" id="del2" hidden aria-label="删除照片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
        </div>
        <div class="prow-pick">
          <button class="pickbtn on" id="pickCamera">拍照</button>
          <button class="pickbtn ghost" id="pickAlbum">从相册选</button>
        </div>
        <input type="file" accept="image/*" capture="environment" id="photoInput" hidden>
        <input type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" id="photoAlbum" hidden>
        <input type="file" accept="image/*" capture="environment" id="photo2Cam" hidden>
        <input type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" id="photo2Alb" hidden>
      </div>

      <div style="margin-top:12px" id="photoActions" hidden>
        <div class="prow2">
          <input id="photoName" placeholder="食材（可选）" autocomplete="off" autocorrect="off">
          <input id="photoGrams" type="number" inputmode="decimal" min="1" step="1" placeholder="克数（可选）">
        </div>
        <input id="photoHint" placeholder="补充说明（可选）" style="margin-bottom:10px">
        <div class="btnrow">
          <button class="btn primary" id="photoGo" style="flex:1">识别热量</button>
        </div>
      </div>
    </div>

    <!-- 搜索（搜索框在卡片顶部） -->
    <div class="pane" id="pane-search" hidden>
      <input id="searchInput" placeholder="搜食物：米饭 / 鸡胸 / 拿铁" autocomplete="off">
      <div class="chips-wrap" style="margin-top:12px" id="recentChips"></div>
      <div class="slist" id="searchList"></div>
    </div>

    <!-- 描述 -->
    <div class="pane" id="pane-text" hidden>
      <textarea id="textInput" rows="4" placeholder="比如：一碗牛肉面，加了两个卤蛋，一杯冰美式"></textarea>
      <button class="btn primary sm" id="textGo" style="margin-top:10px">估算热量</button>
      <div style="font-size:11px;color:var(--muted2);margin-top:10px;line-height:1.6">
        用「碗 / 个 / 份」这类量词就行，会自动换算成克数。
      </div>
    </div>

    <!-- 结果 -->
    <div id="resultArea" hidden>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px">
        <div style="font-size:12.5px;color:var(--muted)" id="resultTitle">识别结果</div>
        <button id="resultReset" style="font-size:11.5px;color:var(--muted2)">重来</button>
      </div>
      <div id="shotBox"></div>
      <div class="field" id="nameWrap" style="margin:0 0 12px" hidden>
        <label>这一餐叫什么</label>
        <input id="batchName" placeholder="如：沙县小吃 / 牛肉面" autocomplete="off" autocorrect="off" autocapitalize="off">
      </div>
      <div id="resultItems"></div>
      <div id="resultNote" style="font-size:11px;color:var(--muted2);line-height:1.6;margin-top:8px"></div>
      <div class="totalrow">
        <span>合计</span><b><span id="resultTotal">0</span> 千卡</b>
      </div>
      <div style="margin-top:14px">
        <div style="font-size:11.5px;color:var(--muted2);margin-bottom:7px">记到哪一餐</div>
        <div class="chips-wrap" id="mealPick">
          <button class="chip" data-meal="breakfast">早餐</button>
          <button class="chip" data-meal="lunch">午餐</button>
          <button class="chip" data-meal="dinner">晚餐</button>
          <button class="chip" data-meal="snack">加餐</button>
        </div>
      </div>
    </div>
  </div>
  <div class="sh-foot" id="addFoot" hidden>
    <button class="btn primary" id="saveItems">记入</button>
  </div>
</div>

<!-- ============ 体重弹层 ============ -->
<div class="sheet-mask" id="nlogMask"></div>
<div class="sheet" id="nlogSheet">
  <div class="grab"></div>
  <div class="sh-hd">
    <h2>提醒记录</h2>
    <button class="x" id="nlogClose">×</button>
  </div>
  <div class="sh-body">
    <div id="nlogList"></div>
  </div>
  <div class="sh-foot">
    <button class="btn" id="nlogClear">清空记录</button>
  </div>
</div>

<div class="sheet-mask" id="weightMask"></div>
<div class="sheet" id="weightSheet">
  <div class="grab"></div>
  <div class="sh-hd">
    <h2>记录体重</h2>
    <button class="x" id="weightClose">×</button>
  </div>
  <div class="sh-body">
    <div class="field">
      <label>体重（kg）</label>
      <input id="weightInput" type="number" inputmode="decimal" step="0.1" placeholder="58.5">
      <div class="hint">建议每天固定在早上空腹、上完厕所后称。体重的日间波动有 1-2kg，看趋势别看单日。</div>
    </div>
  </div>
  <div class="sh-foot">
    <button class="btn primary" id="weightSave">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-mask" id="helpMask"></div>
<div class="sheet" id="helpSheet">
  <div class="grab"></div>
  <div class="sh-hd">
    <h2>自动同步手表</h2>
    <button class="x" id="helpClose">×</button>
  </div>
  <div class="sh-body">
    <div id="helpBody"></div>
  </div>
  <div class="sh-foot">
    <button class="btn primary" id="helpCopy">知道了</button>
  </div>
</div>


<!-- ============ 一组记录详情 ============ -->
<div class="sheet-mask" id="grpMask"></div>
<div class="modal" id="grpSheet">
  <div class="mhd">
    <img class="mshot" id="grpShot" alt="" hidden>
    <div class="mt">
      <h3 id="grpName"><span class="nameline"><span class="nmtxt" id="grpNameTxt">这一餐</span><button class="pen" id="grpRename" aria-label="改名字"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.2" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.8" cy="12" r="2"/></svg></button></span></h3>
      <span id="grpMeta"></span>
    </div>
    <button class="mx" id="grpClose">×</button>
  </div>
  <div class="mbody">
    <div class="mnoshot" id="grpNoShot" hidden>这条是旧版本记的，当时没有存照片</div>
    <div id="grpItems"></div>
    <div class="totalrow"><span>合计</span><b><span id="grpTotal">0</span> 千卡</b></div>
  </div>
</div>

<script src="foods.js?v=465"></script>
<script src="api.js?v=465"></script>
<script src="app.js?v=465"></script>
</body>
</html>
