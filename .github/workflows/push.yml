name: 每天锁屏推送

on:
  schedule:
    - cron: '30 0 * * *'       # UTC 00:30 = 北京时间 08:30 —— 早上上秤提醒
    - cron: '0 14 * * *'       # UTC 14:00 = 北京时间 22:00 —— 晚上补记提醒
  workflow_dispatch:
    inputs:
      event:
        description: '留空=定时检查；也可填 morning / watch / goal / fail 模拟事件'
        required: false
  repository_dispatch:
    types: [watch, goal, fail]   # App 发生事件时立刻触发

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i web-push@3 --no-save
      - name: 发推送
        run: node push/send.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          # 定时触发时用 github.event.schedule 认"是哪一个 cron"，
          # 不能靠"北京时间几点"去猜：GitHub 的定时经常延迟几小时，
          # 昨晚 22:00 那次就是延迟到凌晨 02:12 才跑，被当成"早上"发了上秤提醒（v7.62 修）
          EVENT: ${{ github.event.client_payload.type || github.event.inputs.event || (github.event.schedule == '30 0 * * *' && 'morning') || (github.event.schedule == '0 14 * * *' && 'evening') || '' }}
