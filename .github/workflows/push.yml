name: 每天锁屏推送

# 为什么不是一个 cron：GitHub 的 schedule 经常延迟几十分钟、偶尔整天不跑
# （2026-10-24 早上 08:30 那次压根没出现，用户一条都没收到）。
# 现在改成「窗口内每 10 分钟试一次」，哪个点跑成功就发出去，之后靠 push-sent.json 去重。
on:
  schedule:
    - cron: '*/10 0-1 * * *'   # UTC 00:00–01:59 = 北京时间 08:00–09:59 —— 早上上秤提醒
    - cron: '*/10 13-14 * * *' # UTC 13:00–14:59 = 北京时间 21:00–22:59 —— 晚上补记提醒
  workflow_dispatch:
    inputs:
      event:
        description: '留空=按北京时间自动判断；也可填 morning / evening / watch / goal / fail'
        required: false
  repository_dispatch:
    types: [watch, goal, fail, morning, evening, cron]   # App 事件 + 外部准点触发

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i web-push@3 --no-save
      - name: 发推送
        run: node push/send.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          # 定时触发时不再靠 cron 字符串判断（现在一个窗口有 12 个 cron）：
          # 交给 send.mjs 按北京时间 + 窗口判断，并用 push-sent.json 保证一天只发一次。
          EVENT: ${{ github.event.client_payload.type || github.event.inputs.event || '' }}
      - name: 记下今天已发过（防空窗重复推送）
        run: |
          if [ -f push-sent.json ] && ! git diff --quiet -- push-sent.json; then
            git config user.name "data-bot"
            git config user.email "data-bot@users.noreply.github.com"
            git add push-sent.json
            git commit -m "push sent $(date -u +%FT%TZ)"
            git pull --rebase --autostash -q origin main || true
            git push || true
          fi
