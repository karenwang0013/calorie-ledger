name: 每天锁屏推送

on:
  schedule:
    - cron: '0 14 * * *'       # UTC 14:00 = 北京时间 22:00
  workflow_dispatch:
    inputs:
      event:
        description: '留空=定时检查；也可填 watch / goal / fail 模拟事件'
        required: false
  repository_dispatch:
    types: [watch, goal, fail]   # App 发生事件时立刻触发

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i web-push@3 --no-save
      - name: 发推送
        run: node push/send.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          EVENT: ${{ github.event.client_payload.type || github.event.inputs.event || '' }}
