name: Mirror data from Gitee

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub 最小间隔就是 5 分钟
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch files from Gitee
        run: |
          set -e
          for f in body.json health.json body-history.json data.json; do
            url="https://gitee.com/karen228/calorie-ledger-data/raw/master/$f"
            if curl -fsSL --max-time 20 "$url" -o "$f.new" && [ -s "$f.new" ]; then
              # body.json 例外：快捷指令偶尔查不到健康样本，会写出 {"w":"","bf":"",...} 这种全空值；
              # 那种空文件不许拿来冲掉这里已有好数据（2026-10-24 早上就是这么把前一天的数冲没的）
              # v9.62：正则以前是 '"w":"[0-9]'，但 Gitee 写出来的是 '"w": "64"'（冒号后带空格），
              # 永远匹配不上 → body.json 从 2026-10-24 起就一直没同步过（GitHub 停在旧的 10-24）。
              if [ "$f" = "body.json" ] && ! grep -qE '"w"[[:space:]]*:[[:space:]]*"?[0-9]' "$f.new"; then
                echo "skip $f (gitee copy has no weight value)"
                rm -f "$f.new"
                continue
              fi
              mv "$f.new" "$f"
              echo "ok $f ($(wc -c < "$f") bytes)"
            else
              echo "skip $f (fetch failed)"
              rm -f "$f.new"
            fi
          done
      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "no change"
          else
            git add body.json health.json body-history.json data.json
            git commit -m "mirror data from gitee"
            # 2026-10-24：手机上「健康采集」/ Mac 兜底脚本会直接推这些数据文件，
            # 这里 push 常被拒（! [rejected] fetch first）→ 先 rebase 再推，失败重试三次。
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push failed, rebase and retry ($i)"
              git pull --rebase --autostash origin main || true
              sleep 5
            done
          fi
